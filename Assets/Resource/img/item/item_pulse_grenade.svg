<svg width="64" height="64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grenadeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00ff00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00cc00;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="pulseEffect" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.6" />
      <stop offset="70%" style="stop-color:#00ff00;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#00ff00;stop-opacity:0" />
    </radialGradient>
  </defs>
  
  <!-- 背景圆形 -->
  <circle cx="32" cy="32" r="30" fill="url(#grenadeGradient)" stroke="#ffffff" stroke-width="2"/>
  
  <!-- 脉冲效果 -->
  <circle cx="32" cy="32" r="25" fill="url(#pulseEffect)"/>
  
  <!-- 手雷主体 -->
  <ellipse cx="32" cy="34" rx="12" ry="16" fill="#333333" stroke="#666666" stroke-width="1"/>
  
  <!-- 手雷纹理线条 -->
  <line x1="24" y1="26" x2="40" y2="26" stroke="#555555" stroke-width="1"/>
  <line x1="24" y1="30" x2="40" y2="30" stroke="#555555" stroke-width="1"/>
  <line x1="24" y1="38" x2="40" y2="38" stroke="#555555" stroke-width="1"/>
  <line x1="24" y1="42" x2="40" y2="42" stroke="#555555" stroke-width="1"/>
  
  <!-- 引爆器 -->
  <rect x="30" y="16" width="4" height="8" fill="#666666" rx="1" ry="1"/>
  <circle cx="32" cy="16" r="2" fill="#ff0000"/>
  
  <!-- 脉冲波纹 -->
  <circle cx="32" cy="34" r="8" fill="none" stroke="#00ff00" stroke-width="2" opacity="0.6"/>
  <circle cx="32" cy="34" r="12" fill="none" stroke="#00ff00" stroke-width="1" opacity="0.4"/>
  <circle cx="32" cy="34" r="16" fill="none" stroke="#00ff00" stroke-width="1" opacity="0.2"/>
</svg>