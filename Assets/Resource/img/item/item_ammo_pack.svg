<svg width="64" height="64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ammoPackGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffaa00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff8800;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- 背景圆形 -->
  <circle cx="32" cy="32" r="30" fill="url(#ammoPackGradient)" stroke="#ffffff" stroke-width="2"/>
  
  <!-- 弹药箱主体 -->
  <rect x="16" y="22" width="32" height="20" fill="#333333" rx="2" ry="2"/>
  
  <!-- 弹药箱盖子 -->
  <rect x="16" y="18" width="32" height="6" fill="#555555" rx="2" ry="2"/>
  
  <!-- 子弹图标 -->
  <ellipse cx="24" cy="32" rx="2" ry="6" fill="#ffcc00"/>
  <ellipse cx="32" cy="32" rx="2" ry="6" fill="#ffcc00"/>
  <ellipse cx="40" cy="32" rx="2" ry="6" fill="#ffcc00"/>
  
  <!-- 子弹头部 -->
  <ellipse cx="24" cy="28" rx="2" ry="2" fill="#cc9900"/>
  <ellipse cx="32" cy="28" rx="2" ry="2" fill="#cc9900"/>
  <ellipse cx="40" cy="28" rx="2" ry="2" fill="#cc9900"/>
  
  <!-- 箱子把手 -->
  <rect x="28" y="16" width="8" height="3" fill="#666666" rx="1" ry="1"/>
</svg>