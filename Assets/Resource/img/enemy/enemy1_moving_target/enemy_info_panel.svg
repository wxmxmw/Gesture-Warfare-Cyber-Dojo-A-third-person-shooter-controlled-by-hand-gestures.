<svg width="200" height="80" viewBox="0 0 200 80" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="panelGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:0.9"/>
      <stop offset="50%" style="stop-color:#16213e;stop-opacity:0.95"/>
      <stop offset="100%" style="stop-color:#0f3460;stop-opacity:0.9"/>
    </linearGradient>
    <filter id="panelGlow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- 主背景 -->
  <rect x="0" y="0" width="200" height="80" fill="url(#panelGradient)" stroke="#00ff88" stroke-width="1" rx="4" filter="url(#panelGlow)"/>
  
  <!-- 内边框 -->
  <rect x="2" y="2" width="196" height="76" fill="none" stroke="#00ff88" stroke-width="0.5" opacity="0.4" rx="3"/>
  
  <!-- 标题区域 -->
  <rect x="4" y="4" width="192" height="16" fill="none" stroke="#00ff88" stroke-width="0.5" opacity="0.3" rx="2"/>
  
  <!-- 装饰线条 -->
  <line x1="4" y1="24" x2="196" y2="24" stroke="#00ff88" stroke-width="0.5" opacity="0.3"/>
  
  <!-- 六边形装饰 -->
  <polygon points="8,8 12,6 16,8 16,16 12,18 8,16" fill="none" stroke="#00ff88" stroke-width="0.5" opacity="0.5"/>
  <polygon points="180,8 184,6 188,8 188,16 184,18 180,16" fill="none" stroke="#00ff88" stroke-width="0.5" opacity="0.5"/>
  
  <!-- 状态指示点 -->
  <circle cx="10" cy="30" r="2" fill="#ff4444" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.3;0.8" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="10" cy="40" r="2" fill="#4488ff" opacity="0.8"/>
  <circle cx="10" cy="50" r="2" fill="#00ff88" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.3;0.8" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  
  <!-- 网格纹理 -->
  <defs>
    <pattern id="grid" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M 8 0 L 0 0 0 8" fill="none" stroke="#00ff88" stroke-width="0.2" opacity="0.1"/>
    </pattern>
  </defs>
  <rect x="4" y="28" width="192" height="48" fill="url(#grid)"/>
</svg>