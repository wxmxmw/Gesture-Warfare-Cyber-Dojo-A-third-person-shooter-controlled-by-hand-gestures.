<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="targetGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ff4444;stop-opacity:0.4"/>
      <stop offset="70%" style="stop-color:#cc2222;stop-opacity:0.2"/>
      <stop offset="100%" style="stop-color:#881111;stop-opacity:0.1"/>
    </radialGradient>
    <linearGradient id="metalGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#cccccc;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#999999;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#666666;stop-opacity:1"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- 背景光晕 -->
  <circle cx="32" cy="32" r="30" fill="url(#targetGlow)"/>
  
  <!-- 标靶外圈 -->
  <circle cx="32" cy="32" r="28" fill="url(#metalGradient)" stroke="#444444" stroke-width="2"/>
  
  <!-- 标靶环圈 -->
  <circle cx="32" cy="32" r="24" fill="none" stroke="#ff4444" stroke-width="2" opacity="0.8"/>
  <circle cx="32" cy="32" r="20" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.6"/>
  <circle cx="32" cy="32" r="16" fill="none" stroke="#ff4444" stroke-width="2" opacity="0.8"/>
  <circle cx="32" cy="32" r="12" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.6"/>
  <circle cx="32" cy="32" r="8" fill="none" stroke="#ff4444" stroke-width="2" opacity="0.8"/>
  
  <!-- 中心靶心 -->
  <circle cx="32" cy="32" r="4" fill="#ff0000" stroke="#ffffff" stroke-width="1" filter="url(#glow)"/>
  
  <!-- 移动指示箭头 -->
  <polygon points="32,8 28,14 36,14" fill="#00ff88" opacity="0.7">
    <animateTransform attributeName="transform" type="rotate" values="0 32 32;360 32 32" dur="3s" repeatCount="indefinite"/>
  </polygon>
  
  <!-- 轻甲标识 -->
  <rect x="26" y="48" width="12" height="8" fill="#4488ff" stroke="#2266cc" stroke-width="1" rx="2" opacity="0.8"/>
  <text x="32" y="54" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="6" font-weight="bold">ARMOR</text>
</svg>