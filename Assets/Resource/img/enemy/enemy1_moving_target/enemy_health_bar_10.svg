<svg width="80" height="12" viewBox="0 0 80 12" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="healthGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff0000;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#ff4444;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#ff6666;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#333333;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#222222;stop-opacity:1"/>
    </linearGradient>
    <filter id="innerShadow">
      <feOffset dx="0" dy="1"/>
      <feGaussianBlur stdDeviation="1" result="offset-blur"/>
      <feFlood flood-color="#000000" flood-opacity="0.3"/>
      <feComposite in2="offset-blur" operator="in"/>
    </filter>
  </defs>
  
  <!-- 背景边框 -->
  <rect x="0" y="0" width="80" height="12" fill="none" stroke="#666666" stroke-width="1" rx="2"/>
  
  <!-- 背景 -->
  <rect x="1" y="1" width="78" height="10" fill="url(#bgGradient)" rx="1"/>
  
  <!-- 血量条 (10格) -->
  <rect x="2" y="2" width="7.6" height="8" fill="url(#healthGradient)" rx="1"/>
  <rect x="10.8" y="2" width="7.6" height="8" fill="url(#healthGradient)" rx="1"/>
  <rect x="19.6" y="2" width="7.6" height="8" fill="url(#healthGradient)" rx="1"/>
  <rect x="28.4" y="2" width="7.6" height="8" fill="url(#healthGradient)" rx="1"/>
  <rect x="37.2" y="2" width="7.6" height="8" fill="url(#healthGradient)" rx="1"/>
  <rect x="46" y="2" width="7.6" height="8" fill="url(#healthGradient)" rx="1"/>
  <rect x="54.8" y="2" width="7.6" height="8" fill="url(#healthGradient)" rx="1"/>
  <rect x="63.6" y="2" width="7.6" height="8" fill="url(#healthGradient)" rx="1"/>
  <rect x="72.4" y="2" width="7.6" height="8" fill="url(#healthGradient)" rx="1"/>
  <rect x="81.2" y="2" width="7.6" height="8" fill="url(#healthGradient)" rx="1"/>
  
  <!-- 分割线 -->
  <line x1="10.4" y1="2" x2="10.4" y2="10" stroke="#000000" stroke-width="0.5" opacity="0.5"/>
  <line x1="19.2" y1="2" x2="19.2" y2="10" stroke="#000000" stroke-width="0.5" opacity="0.5"/>
  <line x1="28" y1="2" x2="28" y2="10" stroke="#000000" stroke-width="0.5" opacity="0.5"/>
  <line x1="36.8" y1="2" x2="36.8" y2="10" stroke="#000000" stroke-width="0.5" opacity="0.5"/>
  <line x1="45.6" y1="2" x2="45.6" y2="10" stroke="#000000" stroke-width="0.5" opacity="0.5"/>
  <line x1="54.4" y1="2" x2="54.4" y2="10" stroke="#000000" stroke-width="0.5" opacity="0.5"/>
  <line x1="63.2" y1="2" x2="63.2" y2="10" stroke="#000000" stroke-width="0.5" opacity="0.5"/>
  <line x1="72" y1="2" x2="72" y2="10" stroke="#000000" stroke-width="0.5" opacity="0.5"/>
  <line x1="80.8" y1="2" x2="80.8" y2="10" stroke="#000000" stroke-width="0.5" opacity="0.5"/>
</svg>