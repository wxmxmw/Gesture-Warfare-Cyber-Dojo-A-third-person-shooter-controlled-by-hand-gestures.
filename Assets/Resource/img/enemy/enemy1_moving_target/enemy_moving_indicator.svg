<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="moveGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#00ff88;stop-opacity:0.4"/>
      <stop offset="70%" style="stop-color:#00cc66;stop-opacity:0.2"/>
      <stop offset="100%" style="stop-color:#009944;stop-opacity:0.1"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- 背景光晕 -->
  <circle cx="16" cy="16" r="15" fill="url(#moveGlow)"/>
  
  <!-- 外圈边框 -->
  <circle cx="16" cy="16" r="14" fill="none" stroke="#00ff88" stroke-width="1" opacity="0.6"/>
  
  <!-- 移动轨迹圆圈 -->
  <circle cx="16" cy="16" r="10" fill="none" stroke="#00ff88" stroke-width="1" opacity="0.4" stroke-dasharray="2,2">
    <animateTransform attributeName="transform" type="rotate" values="0 16 16;360 16 16" dur="2s" repeatCount="indefinite"/>
  </circle>
  
  <!-- 移动点 -->
  <circle cx="26" cy="16" r="2" fill="#00ff88" filter="url(#glow)">
    <animateTransform attributeName="transform" type="rotate" values="0 16 16;360 16 16" dur="2s" repeatCount="indefinite"/>
  </circle>
  
  <!-- 方向箭头 -->
  <polygon points="16,6 12,12 20,12" fill="#00ff88" opacity="0.7">
    <animateTransform attributeName="transform" type="rotate" values="0 16 16;360 16 16" dur="2s" repeatCount="indefinite"/>
  </polygon>
  
  <!-- 中心点 -->
  <circle cx="16" cy="16" r="1" fill="#ffffff" opacity="0.8"/>
</svg>