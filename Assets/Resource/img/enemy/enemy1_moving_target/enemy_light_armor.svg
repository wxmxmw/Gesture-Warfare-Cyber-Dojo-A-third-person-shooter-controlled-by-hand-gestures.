<svg width="60" height="10" viewBox="0 0 60 10" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="armorGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4488ff;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#6699ff;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#88aaff;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="armorBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#222244;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#111133;stop-opacity:1"/>
    </linearGradient>
    <filter id="armorGlow">
      <feGaussianBlur stdDeviation="1" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- 背景边框 -->
  <rect x="0" y="0" width="60" height="10" fill="none" stroke="#4488ff" stroke-width="1" rx="2" opacity="0.8"/>
  
  <!-- 背景 -->
  <rect x="1" y="1" width="58" height="8" fill="url(#armorBg)" rx="1"/>
  
  <!-- 轻甲条 (3段) -->
  <rect x="2" y="2" width="18" height="6" fill="url(#armorGradient)" rx="1" filter="url(#armorGlow)"/>
  <rect x="21" y="2" width="18" height="6" fill="url(#armorGradient)" rx="1" filter="url(#armorGlow)"/>
  <rect x="40" y="2" width="18" height="6" fill="url(#armorGradient)" rx="1" filter="url(#armorGlow)"/>
  
  <!-- 分割线 -->
  <line x1="20.5" y1="2" x2="20.5" y2="8" stroke="#000044" stroke-width="0.5" opacity="0.7"/>
  <line x1="39.5" y1="2" x2="39.5" y2="8" stroke="#000044" stroke-width="0.5" opacity="0.7"/>
  
  <!-- 六边形装饰 -->
  <polygon points="6,3 8,2 10,3 10,7 8,8 6,7" fill="none" stroke="#88aaff" stroke-width="0.5" opacity="0.6"/>
  <polygon points="25,3 27,2 29,3 29,7 27,8 25,7" fill="none" stroke="#88aaff" stroke-width="0.5" opacity="0.6"/>
  <polygon points="44,3 46,2 48,3 48,7 46,8 44,7" fill="none" stroke="#88aaff" stroke-width="0.5" opacity="0.6"/>
</svg>