<svg width="256" height="32" viewBox="0 0 256 32" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="emptyBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:0.9"/>
      <stop offset="50%" style="stop-color:#16213e;stop-opacity:0.95"/>
      <stop offset="100%" style="stop-color:#1a1a2e;stop-opacity:0.9"/>
    </linearGradient>
    <linearGradient id="borderGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0066cc;stop-opacity:0.3"/>
      <stop offset="50%" style="stop-color:#0088ff;stop-opacity:0.5"/>
      <stop offset="100%" style="stop-color:#0066cc;stop-opacity:0.3"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Outer glow border -->
  <rect x="0" y="0" width="256" height="32" fill="url(#borderGlow)" rx="4" ry="4" filter="url(#glow)"/>
  
  <!-- Main background -->
  <rect x="2" y="2" width="252" height="28" fill="url(#emptyBg)" rx="3" ry="3"/>
  
  <!-- Inner border -->
  <rect x="3" y="3" width="250" height="26" fill="none" stroke="#0066cc" stroke-width="0.5" rx="2" ry="2" opacity="0.4"/>
  
  <!-- Segmentation lines -->
  <g opacity="0.2">
    <line x1="64" y1="4" x2="64" y2="28" stroke="#0088ff" stroke-width="0.5"/>
    <line x1="128" y1="4" x2="128" y2="28" stroke="#0088ff" stroke-width="0.5"/>
    <line x1="192" y1="4" x2="192" y2="28" stroke="#0088ff" stroke-width="0.5"/>
  </g>
  
  <!-- Hexagonal pattern overlay -->
  <g opacity="0.1">
    <polygon points="20,8 26,12 26,20 20,24 14,20 14,12" fill="none" stroke="#0088ff" stroke-width="0.5"/>
    <polygon points="40,8 46,12 46,20 40,24 34,20 34,12" fill="none" stroke="#0088ff" stroke-width="0.5"/>
    <polygon points="60,8 66,12 66,20 60,24 54,20 54,12" fill="none" stroke="#0088ff" stroke-width="0.5"/>
    <polygon points="80,8 86,12 86,20 80,24 74,20 74,12" fill="none" stroke="#0088ff" stroke-width="0.5"/>
    <polygon points="100,8 106,12 106,20 100,24 94,20 94,12" fill="none" stroke="#0088ff" stroke-width="0.5"/>
    <polygon points="120,8 126,12 126,20 120,24 114,20 114,12" fill="none" stroke="#0088ff" stroke-width="0.5"/>
    <polygon points="140,8 146,12 146,20 140,24 134,20 134,12" fill="none" stroke="#0088ff" stroke-width="0.5"/>
    <polygon points="160,8 166,12 166,20 160,24 154,20 154,12" fill="none" stroke="#0088ff" stroke-width="0.5"/>
    <polygon points="180,8 186,12 186,20 180,24 174,20 174,12" fill="none" stroke="#0088ff" stroke-width="0.5"/>
    <polygon points="200,8 206,12 206,20 200,24 194,20 194,12" fill="none" stroke="#0088ff" stroke-width="0.5"/>
    <polygon points="220,8 226,12 226,20 220,24 214,20 214,12" fill="none" stroke="#0088ff" stroke-width="0.5"/>
    <polygon points="240,8 246,12 246,20 240,24 234,20 234,12" fill="none" stroke="#0088ff" stroke-width="0.5"/>
  </g>
</svg>