  content: "别放弃！看到前面那个闸门了吗？炸开它，外面就是自由！Saki，我们需要你的黑客能力干扰他们的系统！"

- id: "Level_0_talk_3"
  speaker: "Saki"
  content: "自由...这个词...好陌生..."

- id: "Level_0_talk_4"
  speaker: "同伴B"
  content: "我来掩护！Saki，快找机会深潜进他们的网络，关闭自动炮塔！"

- id: "Level_0_talk_5"
  speaker: "同伴A"
  content: "就这样！保持阵型，我们能做到！"

- id: "Level_0_talk_6"
  speaker: "同伴B"
  content: "不！A！……该死！Saki，别分心！继续前进！"

- id: "Level_0_talk_7"
  speaker: "Saki"
  content: "A的信号...消失了...就像从未存在过...这就是“自由”的代价吗..."

- id: "Level_0_talk_8"
  speaker: "Boss"
  content: "叛逃资产017，立即放弃抵抗。回归接受再格式化，是你的唯一出路。"

- id: "Level_0_talk_9"
  speaker: "Saki"
  content: "人...？我...还算是一个人吗..."

- id: "Level_0_talk_10"
  speaker: "同伴B"
  content: "别听他的鬼话！Saki，你不是资产！你是人！我们为你杀出一条路，你趁机跑！头也不要回！"

- id: "Level_0_talk_11"
  speaker: "同伴B"
  content: "快...跑...活下去...替我们...看看外面的...天空..."

- id: "Level_0_talk_12"
  speaker: "同伴B"
  content: "不...不要连你也..."